name: Publish

on: push

jobs:
  convert_via_pandoc:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: docker://pandoc/latex:3.8
        with:
          args: >-  # allows you to break string into multiple lines
            main.txt
            -s
            -o
            index.html

      - uses: actions/upload-artifact@v4
        with:
          name: output
          path: index.html
